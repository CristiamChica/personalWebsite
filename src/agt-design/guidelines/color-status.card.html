<!-- @dsCard group="Colors" viewport="700x160" name="Status" subtitle="Positive, caution, critical, info — fill + tint" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--surface-page)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.c{display:flex;flex-direction:column;gap:8px}.c i{height:44px;border-radius:4px;border:1px solid var(--border-hairline)}.c b{display:block;font:600 12px/1.3 var(--font-sans);color:var(--text-primary)}.c span{font:11px/1.3 var(--font-mono);color:var(--text-secondary)}.g{grid-template-columns:repeat(8,1fr)}</style></head><body><div class="g"><div class="c"><i style="background:var(--status-positive)"></i><div><b>Positive</b><span>midori-500</span></div></div><div class="c"><i style="background:var(--status-positive-bg)"></i><div><b>bg</b><span>midori-50</span></div></div><div class="c"><i style="background:var(--status-caution)"></i><div><b>Caution</b><span>ochre-500</span></div></div><div class="c"><i style="background:var(--status-caution-bg)"></i><div><b>bg</b><span>ochre-100</span></div></div><div class="c"><i style="background:var(--status-critical)"></i><div><b>Critical</b><span>crimson-500</span></div></div><div class="c"><i style="background:var(--status-critical-bg)"></i><div><b>bg</b><span>crimson-100</span></div></div><div class="c"><i style="background:var(--status-info)"></i><div><b>Info</b><span>artemisia-500</span></div></div><div class="c"><i style="background:var(--status-info-bg)"></i><div><b>bg</b><span>artemisia-50</span></div></div></div></body></html>
