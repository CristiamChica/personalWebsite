<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--surface-page)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.c{display:flex;flex-direction:column;gap:8px}.c i{height:44px;border-radius:4px;border:1px solid var(--border-hairline)}.c b{display:block;font:600 12px/1.3 var(--font-sans);color:var(--text-primary)}.c span{font:11px/1.3 var(--font-mono);color:var(--text-secondary)}.g{grid-template-columns:repeat(8,1fr)}</style></head><body><div class="g"><div class="c"><i style="background:var(--surface-page)"></i><div><b>page</b><span>stone-50</span></div></div><div class="c"><i style="background:var(--surface-card)"></i><div><b>card</b><span>stone-0</span></div></div><div class="c"><i style="background:var(--surface-sunken)"></i><div><b>sunken</b><span>stone-100</span></div></div><div class="c"><i style="background:var(--surface-tint)"></i><div><b>tint</b><span>byakuroku-50</span></div></div><div class="c"><i style="background:var(--surface-selected)"></i><div><b>selected</b><span>byakuroku-100</span></div></div><div class="c"><i style="background:var(--surface-nav)"></i><div><b>nav</b><span>artemisia-800</span></div></div><div class="c"><i style="background:var(--text-primary)"></i><div><b>text-primary</b><span>stone-900</span></div></div><div class="c"><i style="background:var(--text-secondary)"></i><div><b>text-secondary</b><span>stone-600</span></div></div></div></body></html>
