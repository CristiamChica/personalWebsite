<!doctype html><html><head><meta charset="utf-8"><title>AGT Platform</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script><script src="data.js"></script></head><body><div id="root"></div>
<script type="text/babel" src="Shell.jsx"></script><script type="text/babel" src="Login.jsx"></script><script type="text/babel" src="Dashboard.jsx"></script><script type="text/babel" src="FieldScreen.jsx"></script><script type="text/babel" src="Report.jsx"></script><script type="text/babel" src="Loan.jsx"></script>
<script type="text/babel">
const { Toast, Button } = window.AGTDesignSystem_48f3d6;
const TITLES={dashboard:['Good morning, Lucía','Estancia La Ferreyra · Córdoba'],field:['Field 14 · Los Álamos','Fields'],report:['Submit field report','Field reports'],loan:['Loan AGT-2291','Loans'],docs:['Documents','Archive']};
function App(){
 const [route,setRoute]=React.useState(localStorage.getItem('agt-route')||'login');
 const [t,setT]=React.useState(null);
 const go=r=>{setRoute(r);localStorage.setItem('agt-route',r)};
 const toast=(title='Field report received',msg='Verification usually takes under 24 hours.')=>{setT({title,msg});setTimeout(()=>setT(null),5000)};
 if(route==='login')return <Login onLogin={()=>go('dashboard')}/>;
 const [title,eyebrow]=TITLES[route];
 const Screen={dashboard:Dashboard,field:FieldView,report:Report,loan:Loan}[route];
 return <div style={{display:'flex',minHeight:'100vh'}}>
  <Sidebar route={route} go={go}/>
  <main style={{flex:1,minWidth:0}}>
   <Topbar title={title} eyebrow={eyebrow} actions={route==='dashboard'&&<Button icon="upload" onClick={()=>go('report')}>Submit report</Button>}/>
   {Screen?<Screen go={go} toast={toast}/>:<div style={{padding:40,color:'var(--text-muted)'}}>Not part of this kit.</div>}
  </main>
  {t&&<div style={{position:'fixed',left:'calc(var(--sidebar-width) + 24px)',bottom:24,zIndex:200}}><Toast tone="positive" title={t.title} message={t.msg} onClose={()=>setT(null)}/></div>}
 </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
